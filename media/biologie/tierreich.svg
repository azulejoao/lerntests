<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Das Tierreich im Überblick</title><desc id="d">Stammbaum der Tiere: Wirbeltiere, Nesseltiere, Weichtiere mit Schnecken, Muscheln und Tintenfischen, Ringelwürmer, Gliederfüßer mit Krebsen, Spinnen und Insekten</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff3d9"/><stop offset="1" stop-color="#e3f1ed"/></linearGradient></defs><rect width="900" height="440" rx="24" fill="url(#bg)"/><text x="28" y="38" fill="#405a43" font-family="Arial,sans-serif" font-size="20" font-weight="bold">TIERREICH · Wirbellose und Wirbeltiere</text><rect x="385" y="60" width="130" height="40" rx="12" fill="#7cc36a" stroke="#355956" stroke-width="2"/><text x="450" y="87" text-anchor="middle" fill="#1d3b2c" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Tiere</text><g stroke="#355956" stroke-width="2.5" fill="none"><path d="M450 100V125M120 125H770M120 125V150M290 125V150M450 125V150M610 125V150M770 125V150"/></g><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-size="17"><rect x="40" y="150" width="160" height="38" rx="10" fill="#fff" stroke="#355956" stroke-width="2"/><text x="120" y="175" fill="#355956">Wirbeltiere</text><rect x="210" y="150" width="160" height="38" rx="10" fill="#fff" stroke="#355956" stroke-width="2"/><text x="290" y="175" fill="#355956">Nesseltiere</text><rect x="370" y="150" width="160" height="38" rx="10" fill="#fbe2a8" stroke="#a8741a" stroke-width="3"/><text x="450" y="175" fill="#6b4a0e">Weichtiere</text><rect x="530" y="150" width="160" height="38" rx="10" fill="#f7c7c0" stroke="#b33a3a" stroke-width="3"/><text x="610" y="175" fill="#7a2020">Ringelwürmer</text><rect x="690" y="150" width="160" height="38" rx="10" fill="#c9e4f0" stroke="#2f7f9c" stroke-width="3"/><text x="770" y="175" fill="#1d5670">Gliederfüßer</text></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#355956"><text x="120" y="222">Fische</text><text x="120" y="248">Amphibien</text><text x="120" y="274">Reptilien</text><text x="120" y="300">Vögel</text><text x="120" y="326">Säugetiere</text><text x="450" y="222">Schnecken</text><text x="450" y="248">Muscheln</text><text x="450" y="274">Tintenfische</text><text x="770" y="222">Krebse</text><text x="770" y="248">Spinnen</text><text x="770" y="274">Insekten</text></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="bold"><text x="450" y="340" fill="#6b4a0e">z. B. Weinbergschnecke</text><text x="610" y="222" fill="#7a2020">z. B. Regenwurm</text><text x="770" y="340" fill="#1d5670">z. B. Honigbiene (Insekt)</text></g><text x="28" y="400" fill="#56746c" font-family="Arial,sans-serif" font-size="13">Insekten sind eine Klasse im Stamm der Gliederfüßer (Arthropoda).</text><text x="28" y="420" fill="#56746c" font-family="Arial,sans-serif" font-size="13">Nur die Wirbeltiere haben eine Wirbelsäule. Regenwurm, Schnecke und Biene sind Wirbellose.</text></svg>
