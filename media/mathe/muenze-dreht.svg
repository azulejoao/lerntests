<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 396 180' width='396' height='180' role='img' aria-label='Eine Münze dreht sich: Kopf oder Zahl'><title>Eine Münze dreht sich: Kopf oder Zahl</title><g transform='translate(108.0,0)'><g><ellipse cx='90' cy='90' rx='70' ry='70' fill='#f5c518' stroke='#b8860b' stroke-width='5'><animate attributeName='rx' dur='1.6s' repeatCount='indefinite' values='70;4;70;4;70'/></ellipse><text x='90' y='100' text-anchor='middle' font-size='26' font-weight='800' fill='#7a5a00' font-family='Helvetica, Arial, sans-serif'>KOPF<animate attributeName='opacity' dur='1.6s' repeatCount='indefinite' calcMode='discrete' values='1;0;0;1' keyTimes='0;0.25;0.75;1'/></text><text x='90' y='108' text-anchor='middle' font-size='44' font-weight='800' fill='#7a5a00' opacity='0' font-family='Helvetica, Arial, sans-serif'>1<animate attributeName='opacity' dur='1.6s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.25;0.75'/></text></g></g></svg>