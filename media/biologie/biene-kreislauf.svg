<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">Offener Blutkreislauf der Biene</title><desc id="d">Seitenansicht der Biene: Das Röhrenherz liegt auf der Rückenseite, nimmt das Blut durch seitliche Öffnungen im Hinterleib auf und pumpt es in den Kopf. Von dort strömt es frei durch den Körper zurück</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff3d9"/><stop offset="1" stop-color="#e3f1ed"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b33a3a"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a5a9a"/></marker></defs><rect width="760" height="390" rx="24" fill="url(#bg)"/><text x="28" y="37" fill="#405a43" font-family="Arial,sans-serif" font-size="20" font-weight="bold">OFFENER BLUTKREISLAUF · Röhrenherz</text><ellipse cx="110" cy="225" rx="72" ry="62" fill="#453936" stroke="#272c2b" stroke-width="4"/><ellipse cx="245" cy="215" rx="62" ry="58" fill="#b17741" stroke="#443b32" stroke-width="4"/><ellipse cx="450" cy="215" rx="190" ry="82" fill="#eabf54" stroke="#433733" stroke-width="5"/><path d="M130 175L560 175" stroke="#b33a3a" stroke-width="20" stroke-linecap="round"/><path d="M130 175L560 175" stroke="#e5726f" stroke-width="9" stroke-linecap="round"/><g stroke="#b33a3a" stroke-width="4" marker-end="url(#a)" fill="none"><path d="M520 262Q512 235 512 195"/><path d="M450 270Q442 240 442 195"/><path d="M380 265Q372 235 372 195"/><path d="M420 175L180 175" stroke-width="5"/></g><g stroke="#7a5a9a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#b)" fill="none"><path d="M120 205Q160 250 300 240Q440 232 580 235"/><path d="M135 215Q175 232 250 225"/></g><g stroke="#788f7e" stroke-width="1.5" fill="none"><path d="M330 175V110H365"/><path d="M455 270V318H500"/><path d="M85 175V130H60"/><path d="M300 245V300H255"/></g><g fill="#355956" font-family="Arial,sans-serif" font-size="15" font-weight="bold"><text x="370" y="115">Röhrenherz (am Rücken)</text><text x="505" y="323">seitliche Öffnungen im Hinterleib</text><text x="28" y="124">Kopf: Blut tritt aus</text><text x="40" y="320">Blut strömt frei zurück</text></g><text x="28" y="378" fill="#56746c" font-family="Arial,sans-serif" font-size="12">Das Herz pumpt das Blut nach vorn in den Kopf. Von dort fließt es frei durch die Körperhöhle zum Hinterleib zurück.</text></svg>