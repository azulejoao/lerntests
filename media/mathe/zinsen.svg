<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Sparbuch: Zum Geld am Anfang kommen nach einem Jahr die Zinsen dazu"><rect width="600" height="340" rx="18" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#14202e" font-weight="bold"><g stroke="#223" stroke-width="3"><rect x="50" y="90" width="150" height="90" rx="12" fill="#5b93e6"/><rect x="400" y="90" width="150" height="90" rx="12" fill="#63bd6a"/></g><path d="M215 135H380" stroke="#223" stroke-width="4"/><path d="M380 122L402 135L380 148Z"/><g text-anchor="middle"><text x="125" y="130" font-size="19" fill="#fff">Geld am Anfang</text><text x="125" y="160" font-size="16" fill="#fff">z. B. 100 €</text><text x="300" y="118" font-size="18">Zinssatz 2 %</text><text x="300" y="170" font-size="15" font-weight="normal">nach 1 Jahr</text><text x="475" y="130" font-size="22">Zinsen</text><text x="475" y="160" font-size="16">z. B. 2 €</text><text x="300" y="250" font-size="19">Zinsen = Geld am Anfang · Zinssatz : 100</text><text x="300" y="290" font-size="17" font-weight="normal">Danach hast du 100 € + 2 € = 102 €.</text></g></g></svg>