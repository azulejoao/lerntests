<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Prozentstreifen: der Grundwert G entspricht 100 Prozent, der Prozentwert W gehört zum Prozentsatz p Prozent"><rect width="600" height="340" rx="18" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#14202e" font-weight="bold"><rect x="50" y="130" width="500" height="70" fill="#fff" stroke="#223" stroke-width="3"/><rect x="50" y="130" width="175" height="70" fill="#5b93e6" stroke="#223" stroke-width="3"/><path d="M50 105V85H550V105M50 225V245H225V225" fill="none" stroke="#223" stroke-width="2.5"/><text x="300" y="70" text-anchor="middle" font-size="21">Grundwert G = 100 %</text><text x="137" y="275" text-anchor="middle" font-size="21">Prozentwert W</text><text x="137" y="172" text-anchor="middle" font-size="22" fill="#fff">p %</text><text x="300" y="320" text-anchor="middle" font-size="16" font-weight="normal">W = G · p : 100  |  p = W · 100 : G  |  G = W · 100 : p</text></g></svg>