<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="Prozentuale Senkung: alter Wert 100 Prozent, neuer Wert 100 minus p Prozent"><rect width="600" height="340" rx="18" fill="#f4f7fb"/><g font-family="Arial,sans-serif" fill="#14202e" font-weight="bold"><rect x="60" y="80" width="450" height="62" fill="#5b93e6" stroke="#223" stroke-width="3"/><rect x="60" y="190" width="340" height="62" fill="#5b93e6" stroke="#223" stroke-width="3"/><rect x="400" y="190" width="110" height="62" fill="#fff" stroke="#223" stroke-width="3" stroke-dasharray="8 6"/><text x="60" y="68" font-size="19">alter Wert: 100 %</text><text x="60" y="178" font-size="19">neuer Wert: (100 − p) %</text><text x="455" y="228" text-anchor="middle" font-size="20">− p %</text><text x="300" y="305" text-anchor="middle" font-size="19">Senkung UM p % = AUF (100 − p) %</text></g></svg>